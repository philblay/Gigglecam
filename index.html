function loop(time){lastTime=time;if(!stream){renderRunning=false;return}if(video.readyState<2){requestAnimationFrame(loop);return}const vw=video.videoWidth,vh=video.videoHeight;layout.scale=Math.max(W/vw,H/vh);layout.dx=(W-vw*layout.scale)/2;layout.dy=(H-vh*layout.scale)/2;ctx.clearRect(0,0,W,H);ctx.save();if(front){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(video,layout.dx,layout.dy,vw*layout.scale,vh*layout.scale);ctx.restore();if(landmarker&&time-lastDetect>70){try{face=landmarker.detectForVideo(video,performance.now()).faceLandmarks[0]||null}catch(e){console.warn('Face tracking:',e)}lastDetect=time}drawScene();drawFace(time);requestAnimationFrame(loop)}
document.getElementById('photo').onclick=async()=>{if(!stream){toast('Tap Start Camera first!');return}const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){toast('Could not make photo');return}const file=new File([blob],'GiggleCam-'+Date.now()+'.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'My GiggleCam photo'});return}catch(e){if(e.name==='AbortError')return}}const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=file.name;a.click();toast('Photo ready! If it opens, hold the image and choose Save to Photos.');setTimeout(()=>URL.revokeObjectURL(u),30000)};
